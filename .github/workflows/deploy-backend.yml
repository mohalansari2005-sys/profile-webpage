name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Stop at the first failed step. ssh-action does not, so the job
            # reported only the last line's exit code: a failed pull, build or
            # migrate still went green, and the canary ran against code that
            # never deployed.
            set -e
            cd /opt/profile-webpage
            git pull
            # `up` does not recreate Caddy for a Caddyfile change, and the file
            # is a single-file bind mount: `git pull` replaces it with a new
            # file, so the running container keeps reading the old one. Hand
            # Caddy the pulled file on stdin instead. reload validates it first
            # and keeps serving the old config if it is invalid -- and fails
            # this job, so the canary does not run against it.
            # First, before `up`: the Caddyfile sets the headers Django reads
            # the visitor's address from. Reloaded last, a new Django ran behind
            # the old proxy -- which passed a client-sent X-Real-IP through --
            # until the job ended, or until the next good deploy if migrate or
            # ingest_content failed in between. The file sets both headers, so
            # the Django still running reads it correctly too, and a reload that
            # fails stops the job before anything else has changed.
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config - --adapter caddyfile < Caddyfile
            # Migrate before the swap, in a one-off container of the new image,
            # while the old web keeps serving. Migrated after `up`, the new code
            # ran against the old schema until migrate finished, and a turn
            # writing a new ChatLog column got a 500. This order needs each
            # migration to keep the old code working (a new column carries a
            # database default), which a rollback needs anyway.
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml run --rm -T web python manage.py migrate
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T web python manage.py ingest_content
