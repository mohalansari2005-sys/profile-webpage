name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Stop at the first failed step. ssh-action does not, so the job
            # reported only the last line's exit code: a failed pull, build or
            # migrate still went green, and the canary ran against code that
            # never deployed.
            set -e
            cd /opt/profile-webpage
            caddyfile_before=$(sha256sum Caddyfile)
            git pull
            caddyfile_after=$(sha256sum Caddyfile)
            # A changed Caddyfile reaches Caddy only in a new container. `up`
            # does not recreate one for it, and `git pull` replaces the file
            # rather than rewriting it, so the running container's single-file
            # bind mount keeps showing the old one. Validated first, in a
            # one-off container that mounts the pulled file: a bad one fails
            # the job here, with Caddy still serving the old config and web not
            # yet touched. A recreated container binds the new file; its
            # certificates live in the caddy_data volume and carry over. Unlike
            # `exec`-ing into Caddy, this works with it stopped or crash-looping.
            # Only when the pull changed the file: a recreate cuts off the
            # requests in flight.
            # First, before web: the Caddyfile sets the headers Django reads
            # the visitor's address from, and a new Django must not run behind
            # an old proxy config, even for the length of a build.
            if [ "$caddyfile_after" != "$caddyfile_before" ]; then
              docker compose -f docker-compose.prod.yml run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate caddy
            fi
            # Migrate before the swap, in a one-off container of the new image,
            # while the old web keeps serving. Migrated after `up`, the new code
            # ran against the old schema until migrate finished, and a turn
            # writing a new ChatLog column got a 500. This order needs each
            # migration to keep the old code working (a new column carries a
            # database default), which a rollback needs anyway.
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml run --rm -T web python manage.py migrate
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T web python manage.py ingest_content
